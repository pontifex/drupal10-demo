services:
  architect_studio.project_repository:
    class: Drupal\architect_studio\Repository\ProjectRepository
    arguments: ['@database', '@datetime.time', '@cache_tags.invalidator']

  architect_studio.order_repository:
    class: Drupal\architect_studio\Repository\OrderRepository
    arguments: ['@database', '@datetime.time']

  architect_studio.inquiry_repository:
    class: Drupal\architect_studio\Repository\InquiryRepository
    arguments: ['@database', '@datetime.time']

  architect_studio.payment_gateway:
    class: Drupal\architect_studio\Service\PaymentGatewayService
    arguments: ['@logger.channel.architect_studio']

  logger.channel.architect_studio:
    parent: logger.channel_base
    arguments: ['architect_studio']

  architect_studio.language_redirect_subscriber:
    class: Drupal\architect_studio\EventSubscriber\LanguageRedirectSubscriber
    tags:
      - { name: event_subscriber }

  architect_studio.seo_meta:
    class: Drupal\architect_studio\Service\SeoMetaService
    arguments: ['@request_stack', '@architect_studio.project_repository']

