name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    name: Code Quality & PHPUnit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pdo, pdo_mysql, gd
          coverage: none
          tools: composer:v2

      - name: Verify composer.json and composer.lock Synchronization
        run: composer validate --check-lock --strict

      - name: Check Platform Requirements
        run: composer check-platform-reqs

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run PHP_CodeSniffer (Drupal & DrupalPractice Standards)
        run: composer phpcs

      - name: Run PHPStan (Static Analysis Level 6)
        run: composer phpstan

      - name: Run PHPUnit Tests
        run: composer phpunit

  e2e-playwright-tests:
    name: Playwright Functional E2E Tests
    runs-on: ubuntu-latest
    needs: quality-and-tests

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Wait for Railway Deployment (on push to main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "Waiting 50s for Railway automated container build and deployment..."
          sleep 50

      - name: Run Playwright Functional Tests
        run: npm run test:e2e
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        env:
          PLAYWRIGHT_BASE_URL: https://drupal10-demo-production.up.railway.app
          CI: true

      - name: Upload Playwright HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

